<h1>PT Git</h1><p>Meaningful version control for Packet Tracer labs.</p><button id="play">Replay 12-second demo</button>

<script>const events=[[0.0, "o", "$ git diff -- lab.pkt\r\ndiff --git a/lab.pkt b/lab.pkt\r\nindex eb3c998..9613245 100644\r\nBinary files a/lab.pkt and b/lab.pkt differ\r\n"], [4.0, "o", "$ ptgit diff old.pkt lab.pkt\r\nR1\r\n  interface GigabitEthernet0/0\r\n   ip address 192.168.10.1/24\r\n   no shutdown\r\n+ interface GigabitEthernet0/1\r\n+  ip address 10.10.20.1/24\r\n+  no shutdown\r\n\r\nSW2\r\n  interface GigabitEthernet0/1\r\n   switchport mode access\r\n-  switchport access vlan 10\r\n+  switchport access vlan 20\r\n\r\nTopology\r\n+ R1:GigabitEthernet0/1 \u003c-> SW2:GigabitEthernet0/1 [eStraightThrough]\r\n"], [8.0, "o", "$ git diff -- lab.pkt  # after ptgit init\r\ndiff --git a/lab.pkt b/lab.pkt\r\nindex eb3c998..9613245 100644\r\n--- a/lab.pkt\r\n+++ b/lab.pkt\r\n@@ -7,6 +7,9 @@ R1\r\n   interface GigabitEthernet0/0\r\n    ip address 192.168.10.1/24\r\n    no shutdown\r\n+  interface GigabitEthernet0/1\r\n+   ip address 10.10.20.1/24\r\n+   no shutdown\r\n \r\n SW2\r\n   type Switch (2960-24TT)\r\n@@ -16,8 +19,9 @@ SW2\r\n   hostname SW2\r\n   interface GigabitEthernet0/1\r\n    switchport mode access\r\n-   switchport access vlan 10\r\n+   switchport access vlan 20\r\n \r\n Topology\r\n+  R1:GigabitEthernet0/1 \u003c-> SW2:GigabitEthernet0/1 [eStraightThrough]\r\n \r\n-Modeled fields SHA-256: fa7cbde23887f7c7a10ca1fe29b768c62dfea00f30a34aa9095c01e956d9c224\r\n+Modeled fields SHA-256: 3881c33239bf69826bcfdde5c7c15068758c2a1cd885a149f55d2296a67acf8c\r\n"]];let timers=[];const screen=document.getElementById('screen');function play(){timers.forEach(clearTimeout);timers=[];screen.textContent='';events.forEach(e=>timers.push(setTimeout(()=>{screen.textContent=e[2];},e[0]*1000)));}document.getElementById('play').onclick=play;play();</script></html>
