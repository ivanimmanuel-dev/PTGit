name: Release
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/tests.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Verify selected version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python -c 'import os, ptgit; r=os.environ["RELEASE_REF"]; assert not r.startswith("refs/tags/") or r == "refs/tags/v" + ptgit.__version__, "Tag/version mismatch"'
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_install.py dist/packet_tracer_git-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
